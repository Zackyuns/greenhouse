<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <defs>
    <linearGradient id="leafGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2E7D32;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Stem -->
  <path d="M 12 22 L 12 12" stroke="#6D4C41" stroke-width="2" stroke-linecap="round"/>

  <!-- Left leaf -->
  <path d="M 12 15 Q 7 13 5 10 Q 4 8 5 7 Q 6 6 8 7 Q 10 9 12 12"
        fill="url(#leafGradient)" stroke="#2E7D32" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- Right leaf -->
  <path d="M 12 12 Q 14 9 16 7 Q 18 6 19 7 Q 20 8 19 10 Q 17 13 12 15"
        fill="url(#leafGradient)" stroke="#2E7D32" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- Top leaf -->
  <path d="M 12 12 Q 11 7 10 4 Q 9.5 2 11 2 Q 12 2 13 2 Q 14.5 2 14 4 Q 13 7 12 12"
        fill="#81C784" stroke="#388E3C" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- Pot -->
  <path d="M 8 22 L 10 18 L 14 18 L 16 22 Z"
        fill="#8D6E63" stroke="#5D4037" stroke-width="1.5"/>
  <rect x="7" y="22" width="10" height="1.5" fill="#5D4037" rx="0.5"/>

  <!-- Leaf veins -->
  <path d="M 7 9 Q 9 10 10 11" stroke="#1B5E20" stroke-width="0.5" opacity="0.5"/>
  <path d="M 17 9 Q 15 10 14 11" stroke="#1B5E20" stroke-width="0.5" opacity="0.5"/>
</svg>